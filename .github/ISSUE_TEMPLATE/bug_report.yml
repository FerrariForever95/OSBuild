name: Bug report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in OSBuild.

        Please select the firmware release you are using, then describe the issue.

  - type: input
    id: firmware-release
    attributes:
      label: Firmware release
      description: |
        Enter the exact directory name of the release you are using from `firmware-releases/`.
        Please use the directory name exactly as shown in the repository.
      placeholder: |
        e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: |
        What is wrong? Describe what happened and, if useful, include the exact error message or output.
      placeholder: |
        Describe the problem here...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OSBuild!